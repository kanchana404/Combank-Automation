services:
  combank-scraper:
    build: .
    container_name: combank-scraper
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      # Google OAuth - Set these if you want to use environment variables instead of file
      # - GOOGLE_CLIENT_ID=your_client_id
      # - GOOGLE_CLIENT_SECRET=your_client_secret
      # - GOOGLE_REDIRECT_URI=http://localhost:8000/auth/google/callback
      # Google Tokens - Set these after getting tokens from /auth/tokens endpoint
      # - GOOGLE_ACCESS_TOKEN=your_access_token
      # - GOOGLE_REFRESH_TOKEN=your_refresh_token
    shm_size: '2gb'  # Required for Chrome in Docker
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - combank-network

networks:
  combank-network:
    driver: bridge

