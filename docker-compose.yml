services:
  combank-scraper:
    build: .
    container_name: combank-scraper
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
    shm_size: '2gb'  # Required for Chrome in Docker
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - combank-network

networks:
  combank-network:
    driver: bridge

